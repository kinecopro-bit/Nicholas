name: Firebase Hosting preview

on:
  pull_request:
    paths:
      - "public/**"
      - "firebase.json"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  preview:
    # Fork PRs don't receive secrets
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NICHOLAS_KOKAT }}
          projectId: nicholas-kokat
          expires: 7d
